[package]
name = "netwatch"
version = "0.1.0"
description = "Real-time outbound network connection monitor for Windows"
authors = ["Alfred Gabriel <https://github.com/alfredgabriel>"]
edition = "2021"

[lib]
name = "netwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dashmap = "5.5"
dns-lookup = "2.0"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi"
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
